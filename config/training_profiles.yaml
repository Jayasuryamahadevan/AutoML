# Training Profiles for Different Use Cases

fast:
  description: "Quick iteration for testing"
  dataset_size: 50
  max_steps: 50
  learning_rate: 3.0e-4
  batch_size: 4
  lora_rank: 8
  
balanced:
  description: "Good quality with reasonable time"
  dataset_size: 100
  max_steps: 100
  learning_rate: 2.0e-4
  batch_size: 2
  lora_rank: 16

quality:
  description: "Maximum quality, longer training"
  dataset_size: 200
  max_steps: 200
  learning_rate: 1.5e-4
  batch_size: 1
  lora_rank: 32
  gradient_accumulation_steps: 8
